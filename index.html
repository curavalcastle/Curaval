<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#50CCBC" />
  <meta name="description" content="Curaval Castle — pharmaceutical distribution and logistics across Egypt." />
  <meta property="og:title" content="Curaval Castle | كيورافال كاسل" />
  <meta property="og:image" content="logo-full.png" />
  <title>Curaval Castle | كيورافال كاسل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&family=Zain:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="hero-3d.css" />
  <link rel="stylesheet" href="typography.css" />
  <link rel="stylesheet" href="single-site.css" />
  <link rel="stylesheet" href="spa-views.css" />
  <link rel="stylesheet" href="interactions.css" />
  <link rel="stylesheet" href="reveal-fix.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"><span></span></div>
  <header class="site-header" id="home">
    <nav class="nav container" aria-label="Primary navigation">
      <a class="logo" href="#home"><img src="logo-transparent.png" alt="Curaval Castle" /></a>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false"><i data-lucide="menu"></i></button>
      <div class="nav-links"><span class="nav-pill" aria-hidden="true"></span>
        <a href="#home" class="view-link active" data-view="home">الرئيسية</a><a href="#branches" class="view-link" data-view="branches">فروعنا</a><a href="#join-us" class="view-link" data-view="join">انضم إلينا</a><a href="#contact" class="view-link" data-view="contact">تواصل معنا</a>
      </div>
      <div class="nav-actions"><button class="language-switch" type="button">EN</button><button class="theme-switch" type="button" aria-label="Toggle theme"><i data-lucide="moon"></i></button><a class="button nav-cta" href="#join-us" data-nav="joinUs"></a></div>
    </nav>
  </header>

  <div class="ambient-orbs" aria-hidden="true"><span class="ambient-orb orb-a"></span><span class="ambient-orb orb-b"></span><span class="ambient-orb orb-c"></span></div>
  <main>
    <section class="hero section">
      <div class="hero-overlay"></div><div class="hero-orb orb-one"></div><div class="hero-orb orb-two"></div>
      <div class="hero-scene" aria-hidden="true"><div class="scene-ring ring-one"></div><div class="scene-ring ring-two"></div><div class="scene-floor"></div><div class="scene-cube cube-one"><span></span><span></span><span></span></div><div class="scene-cube cube-two"><span></span><span></span><span></span></div><div class="scene-particle particle-one"></div><div class="scene-particle particle-two"></div><div class="scene-particle particle-three"></div><div class="scene-cross">+</div></div>
      <div class="container hero-content">
        <p class="eyebrow light"><i data-lucide="sparkles"></i><span data-hero="badge"></span></p>
        <h1 data-hero="title"></h1><p class="hero-description" data-hero="description"></p>
        <div class="hero-actions"><a class="button" href="#join-us" data-hero="ctaPrimary"></a><a class="button button-outline" href="#services" data-hero="ctaSecondary"></a></div>
        <div class="hero-stats" id="stats"></div>
      </div>
    </section>

    <section class="section about" id="about"><div class="container split-layout">
      <div class="about-copy reveal"><p class="eyebrow"><i data-lucide="castle"></i><span data-about="sectionBadge"></span></p><h2 data-about="mainTitle"></h2><p class="lead" data-about="overview"></p>
        <div class="purpose-grid"><article><i data-lucide="eye"></i><h3 data-about="visionTitle"></h3><p data-about="visionText"></p></article><article><i data-lucide="heart-handshake"></i><h3 data-about="missionTitle"></h3><p data-about="missionText"></p></article></div>
      </div><div class="trust-panel reveal"><div class="castle-mark">✦</div><p class="panel-kicker" data-about="valuesTitle"></p><div class="value-list" id="values"></div></div>
    </div></section>

    <section class="section tinted" id="services"><div class="container"><div class="section-heading reveal"><p class="eyebrow"><i data-lucide="boxes"></i><span data-services="sectionBadge"></span></p><h2 data-services="mainTitle"></h2></div><div class="services-grid" id="services-grid"></div></div></section>

    <section class="section" id="network"><div class="container network-layout"><div class="network-copy reveal"><p class="eyebrow"><i data-lucide="map-pinned"></i><span class="network-label"></span></p><h2 class="network-title"></h2><p class="network-body"></p><div class="coverage-points"><span><i data-lucide="circle-check"></i> 27 Governorates</span><span><i data-lucide="circle-check"></i> +15,000 Facilities</span><span><i data-lucide="circle-check"></i> 24/7 Operations</span></div></div><div class="map-card reveal tilt-card"><div class="map-grid"></div><div class="map-route route-a"></div><div class="map-route route-b"></div><div class="map-route route-c"></div><div class="map-pin pin-a"></div><div class="map-pin pin-b"></div><div class="map-pin pin-c"></div><div class="map-center"><i data-lucide="cross"></i></div><p>EGYPT · NATIONWIDE REACH</p></div></div></section>

    <section class="section fleet-section" id="fleet"><div class="container fleet-layout"><div class="fleet-preview reveal tilt-card"><video autoplay muted loop playsinline><source src="Videos/صناعة%20الدواء.mp4" type="video/mp4" /></video><div class="preview-caption"><i data-lucide="thermometer-snowflake"></i><span>2°C — 8°C</span></div></div><div class="fleet-copy reveal"><p class="eyebrow"><i data-lucide="truck"></i><span class="fleet-label"></span></p><h2 class="fleet-title"></h2><p class="fleet-body"></p><div class="fleet-numbers"><div><strong>500+</strong><span>Vehicles</span></div><div><strong>GPS</strong><span>Live Tracking</span></div><div><strong>GDP</strong><span>Compliant</span></div></div></div></div></section>

    <section class="section join-section" id="join"><div class="container join-layout"><div class="join-copy reveal"><p class="eyebrow"><i data-lucide="badge-check"></i><span data-form="sectionBadge"></span></p><h2 data-form="title"></h2><p class="lead" data-form="subtitle"></p><div class="join-seal"><i data-lucide="shield-check"></i><span>GDP Compliant · Secure Partner Onboarding</span></div><a class="button join-page-cta" href="#join-us"><span data-join-page>اختر طريقة انضمامك</span><i data-lucide="arrow-left"></i></a></div>
      <form class="partner-form reveal" id="partner-form" novalidate>
        <input type="hidden" name="_subject" value="New Curaval Castle partner registration" /><input type="hidden" name="_template" value="table" /><input type="text" name="_honey" class="honeypot" tabindex="-1" autocomplete="off" />
        <div class="form-grid"><label class="field"><i data-lucide="warehouse"></i><input required name="facility" type="text" placeholder=" " /><span data-form="fieldWarehouse"></span></label><label class="field"><i data-lucide="user-round"></i><input required name="manager" type="text" placeholder=" " /><span data-form="fieldManager"></span></label><label class="field"><i data-lucide="map"></i><select required name="governorate"><option value="" selected disabled></option><option>Cairo</option><option>Giza</option><option>Alexandria</option><option>Qalyubia</option><option>Other Governorate</option></select><span data-form="fieldGov"></span></label><label class="field"><i data-lucide="map-pin"></i><input required name="address" type="text" placeholder=" " /><span data-form="fieldAddress"></span></label><label class="field"><i data-lucide="phone"></i><input required name="phone_primary" inputmode="tel" type="tel" placeholder=" " /><span data-form="fieldPhone1"></span></label><label class="field"><i data-lucide="smartphone"></i><input name="phone_secondary" inputmode="tel" type="tel" placeholder=" " /><span data-form="fieldPhone2"></span></label></div><p class="form-error" aria-live="polite"></p><button class="button submit-button" type="submit"><span data-form="submitBtn"></span><i data-lucide="send"></i></button><p class="form-success" aria-live="polite"></p>
      </form>
    </div></section>
    <section class="section branches-section" id="branches"><div class="container"><div class="section-heading"><p class="eyebrow"><i data-lucide="map-pinned"></i><span data-branches="badge"></span></p><h2 data-branches="title"></h2><p class="lead" data-branches="description"></p></div><div class="branches-grid" id="branches-grid"></div></div></section>
    <section class="section join-us-section" id="join-us"><div class="container"><div class="section-heading"><p class="eyebrow"><i data-lucide="handshake"></i><span data-joinus="badge"></span></p><h2 data-joinus="title"></h2><p class="lead" data-joinus="description"></p></div><div class="join-tabs" id="join-tabs"></div><div id="join-forms"></div></div></section>
  </main>
  <div class="branch-modal" id="branch-modal" aria-hidden="true"><div class="branch-dialog"><button class="modal-close" type="button" aria-label="Close"><i data-lucide="x"></i></button><div id="branch-profile"></div></div></div>
  <footer id="contact"><div class="container footer-grid"><div><img class="footer-logo" src="logo-full.png" alt="Curaval Castle" /><p class="footer-summary">Precision pharmaceutical distribution, powered by care.</p></div><div><h3 data-contact="title"></h3><a href="tel:+201143489418"><i data-lucide="phone"></i><span data-contact="phone"></span></a><a href="mailto:curavalcastle@gmail.com"><i data-lucide="mail"></i><span data-contact="email"></span></a><a href="https://www.facebook.com/CuravalCastle" target="_blank" rel="noreferrer"><i data-lucide="share-2"></i><span data-contact="facebook"></span></a></div><div class="footer-address"><i data-lucide="map-pin"></i><span data-contact="address"></span></div></div><div class="container copyright" data-contact="rights"></div></footer>
  <a class="quick-contact" href="https://wa.me/201143489418" target="_blank" rel="noreferrer" aria-label="WhatsApp Curaval Castle"><i data-lucide="message-circle"></i></a>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script><script src="app.js"></script>
</body></html>
